name: Standalone Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (dev or prod)"
        required: true
        default: "dev"
      confirm:
        description: "Type YES to confirm destroy"
        required: true

env:
  PROJECT_DIR: kafka-ord-pay-stk-service
  AWS_REGION: us-east-1

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'YES' }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Show Destroy Plan
        run: |
          echo "🔹 Showing Terraform destroy plan for environment: ${{ github.event.inputs.environment }}"
          terraform plan \
            -destroy \
            -var-file=${{ github.event.inputs.environment }}/terraform.tfvars \
            -out=tfplan
          terraform show -no-color tfplan > destroy_plan.log

      - name: Upload Destroy Plan Log
        uses: actions/upload-artifact@v4
        with:
          name: destroy-plan-log
          path: destroy_plan.log

      - name: Execute Destroy
        run: terraform apply -auto-approve tfplan
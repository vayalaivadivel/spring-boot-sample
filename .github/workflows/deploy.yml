name: Deploy Microservices to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
          - payment-service
          - stock-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: |
          mvn -pl sbt-kafka-order-payment-stock-service/${{ matrix.service }} \
              -am clean package -DskipTests

      - name: Deploy ${{ matrix.service }} to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY:  ${{ secrets.EC2_KEY }}
          SERVICE:  ${{ matrix.service }}
        run: |
          echo "🚀 Deploying $SERVICE..."

          # Create SSH key
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          # Get the JAR path
          JAR=$(ls sbt-kafka-order-payment-stock-service/$SERVICE/target/*.jar | head -n 1)

          # Copy JAR to EC2
          scp -i key.pem -o StrictHostKeyChecking=no "$JAR" $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          # SSH into EC2 and deploy
          ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
            set -e

            echo "📁 Ensure service folder exists"
            sudo mkdir -p /opt/$SERVICE
            sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE

            echo "⚙️ Generate systemd file if missing"
            if [ ! -f /etc/systemd/system/$SERVICE.service ]; then
              sudo tee /etc/systemd/system/$SERVICE.service > /dev/null << EOL
          [Unit]
          Description=$SERVICE
          After=network.target

          [Service]
          User=$EC2_USER
          WorkingDirectory=/opt/$SERVICE
          ExecStart=/usr/bin/java -jar /opt/$SERVICE/$SERVICE.jar
          Restart=always
          RestartSec=5
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOL
                        sudo systemctl daemon-reload
                        sudo systemctl enable $SERVICE
                      fi

                      echo "🛑 Stop service if running"
                      sudo systemctl stop $SERVICE || true

                      echo "📦 Move JAR into place"
                      mv /home/$EC2_USER/*.jar /opt/$SERVICE/$SERVICE.jar

                      echo "▶️ Start service"
                      sudo systemctl start $SERVICE

                      echo "📊 Service status"
                      sudo systemctl status $SERVICE --no-pager
          EOF
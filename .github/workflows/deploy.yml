name: Deploy microservices to EC2 with terraform

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:

# =====================================================
# 1️⃣ Build Microservices
# =====================================================
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
          - payment-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        run: |
          cd sbt-kafka-order-payment-stock-service
          mvn clean package -pl ${{ matrix.service }} -am -DskipTests

      # 🔥 Upload artifact for next jobs
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}
          path: sbt-kafka-order-payment-stock-service/${{ matrix.service }}/target/*.jar



# =====================================================
# 2️⃣ Terraform Infrastructure Provisioning
# =====================================================
  terraform:
    runs-on: ubuntu-latest
    needs: build

    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_brokers: ${{ steps.tf_outputs.outputs.kafka_brokers }}

    steps:
      - uses: actions/checkout@v4

      # 🔥 Configure IAM user (vadivel-iam)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 🔎 Debug: confirm IAM identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file=${{ env.ENVIRONMENT }}/terraform.tfvars \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_brokers=$(terraform output -raw kafka_bootstrap_brokers)" >> $GITHUB_OUTPUT



# =====================================================
# 3️⃣ Deploy Microservices to EC2
# =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: terraform

    strategy:
      matrix:
        service:
          - order-service
          - payment-service

    steps:
      - uses: actions/checkout@v4

      # 🔥 Download artifact from build job
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}
          path: .

      - name: Deploy ${{ matrix.service }}
        env:
          EC2_HOST: ${{ needs.terraform.outputs.ec2_ip }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY:  ${{ secrets.EC2_KEY }}
          SERVICE:  ${{ matrix.service }}
          KAFKA_BROKERS: ${{ needs.terraform.outputs.kafka_brokers }}
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          JAR=$(ls *.jar | head -n 1)

          echo "🚀 Deploying $SERVICE to $EC2_HOST"

          scp -i key.pem -o StrictHostKeyChecking=no \
            "$JAR" $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          ssh -i key.pem -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST << EOF
          set -e

          sudo mkdir -p /opt/$SERVICE
          sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE

          echo "KAFKA_BOOTSTRAP_SERVERS=$KAFKA_BROKERS" | sudo tee /opt/$SERVICE/.env

          if [ ! -f /etc/systemd/system/$SERVICE.service ]; then
            sudo tee /etc/systemd/system/$SERVICE.service > /dev/null << EOL
          [Unit]
          Description=$SERVICE
          After=network.target

          [Service]
          User=$EC2_USER
          WorkingDirectory=/opt/$SERVICE
          ExecStart=/usr/bin/java -Xms512m -Xmx1g -jar /opt/$SERVICE/$SERVICE.jar
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOL

            sudo systemctl daemon-reload
            sudo systemctl enable $SERVICE
          fi

          sudo systemctl stop $SERVICE || true
          mv /home/$EC2_USER/*.jar /opt/$SERVICE/$SERVICE.jar
          sudo systemctl restart $SERVICE
          sudo systemctl status $SERVICE --no-pager
          EOF
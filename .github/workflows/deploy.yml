name: Deploy Multiple Microservices to EC2

# Trigger on push to master/main OR manual run
on:
  push:
    branches:
      - master
      - main
    paths:
      - "sbt-kafka-order-payment-stock-service/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
          # - payment-service
          # - stock-service

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3️⃣ Debug folder structure
      - name: Debug workspace
        run: |
          echo "Current directory:"
          pwd
          echo "Repo root contents:"
          ls -lrt
          echo "sbt-kafka-order-payment-stock-service contents:"
          ls -lrt sbt-kafka-order-payment-stock-service || echo "Folder not found"

      # 4️⃣ Build Maven project
      - name: Build Maven project
        run: |
          cd sbt-kafka-order-payment-stock-service || exit 1
          mvn clean install -DskipTests

      # 5️⃣ Deploy service to EC2
      - name: Deploy ${{ matrix.service }} to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY_B64: ${{ secrets.EC2_KEY_B64 }}
        run: |
          echo "Deploying ${{ matrix.service }}..."

          # Decode Base64 private key to key.pem
          echo "$EC2_KEY_B64" | base64 --decode > key.pem
          chmod 600 key.pem

          # Copy JAR to EC2
          scp -i key.pem -o StrictHostKeyChecking=no sbt-kafka-order-payment-stock-service/${{ matrix.service }}/target/${{ matrix.service }}-1.0-SNAPSHOT.jar $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          # SSH into EC2 and restart service
          ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            sudo systemctl stop ${{ matrix.service }} || true
            mv ~/${{ matrix.service }}-1.0-SNAPSHOT.jar /opt/${{ matrix.service }}/${{ matrix.service }}.jar
            sudo systemctl start ${{ matrix.service }}
            sudo systemctl status ${{ matrix.service }}
          EOF


      # 6️⃣ Verify Java version
      - name: Verify Java version
        run: java -version
name: Deploy Microservices to EC2 (Matrix)

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  PROJECT_DIR: sbt-kafka-order-payment-stock-service
  AWS_REGION: us-east-1

jobs:

  # =====================================================
  # 1️⃣ Build All Services and Upload Artifacts
  # =====================================================
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - order-service
          # - payment-service
          # - stock-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "🔨 Building ${{ matrix.service }}..."
          mvn -pl ${{ matrix.service }} -am clean package -DskipTests

          # Find Spring Boot fat JAR
          JAR=$(find ${{ matrix.service }}/target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "❌ JAR not found for ${{ matrix.service }}"
            find . -name "*.jar"
            exit 1
          fi

          mkdir -p artifact
          cp "$JAR" artifact/${{ matrix.service }}.jar
          echo "✅ Built and copied: ${{ matrix.service }}.jar"

  # =====================================================
  # 2️⃣ Terraform Infrastructure
  # =====================================================
  terraform:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_bootstrap: ${{ steps.tf_outputs.outputs.kafka_bootstrap }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform validate
          terraform plan -var-file=${{ env.ENVIRONMENT }}/terraform.tfvars -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_bootstrap=$(terraform output -raw kafka_bootstrap_brokers)" >> $GITHUB_OUTPUT

  # =====================================================
  # 3️⃣ Verify Artifacts (Matrix)
  # =====================================================
  deploy-verify-artifacts:
    runs-on: ubuntu-latest
    needs: [build, terraform]
    strategy:
      matrix:
        service:
          - order-service
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact for ${{ matrix.service }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./artifact

      - name: Debug downloaded artifact
        run: |
          echo "Listing all files in current dir:"
          pwd
          find . -type f

      - name: Verify artifact
        run: |
          echo "===== Verifying artifact for service: ${{ matrix.service }} ====="
          FILE=$(find artifact -maxdepth 1 -name "${{ matrix.service }}*.jar" | head -n 1)
          if [ -f "$FILE" ]; then
            echo "✅ Artifact found: $FILE"
            ls -lh "$FILE"
          else
            echo "❌ Artifact not found!"
            echo "Contents of artifact folder:"
            ls -la artifact || true
            exit 1
          fi

name: Deploy microservices to EC2 with Terraform

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  PROJECT_DIR: sbt-kafka-order-payment-stock-service
  AWS_REGION: us-east-1

# =====================================================
# 1️⃣ Build Microservices
# =====================================================
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - order-service
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        run: |
          mvn clean package \
            -pl ${{ matrix.service }} \
            -am \
            -DskipTests

          JAR=$(ls ${{ matrix.service }}/target/*.jar | grep -v original | head -n 1)
          if [ ! -f "$JAR" ]; then
            echo "❌ JAR not found for ${{ matrix.service }}"
            exit 1
          fi
          echo "✅ Built $JAR"

# =====================================================
# 2️⃣ Terraform Infrastructure
# =====================================================
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build
    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_brokers_tls: ${{ steps.tf_outputs.outputs.kafka_brokers_tls }}

    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=dev/terraform.tfvars -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=dev/terraform.tfvars

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_brokers_tls=$(terraform output -raw kafka_bootstrap_brokers_tls)" >> $GITHUB_OUTPUT

# =====================================================
# 3️⃣ Deploy Microservices to EC2
# =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: terraform
    strategy:
      matrix:
        service:
          - order-service
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy ${{ matrix.service }}
        env:
          EC2_HOST: ${{ needs.terraform.outputs.ec2_ip }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          SERVICE: ${{ matrix.service }}
          KAFKA_BROKERS_TLS: ${{ needs.terraform.outputs.kafka_brokers_tls }}
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          JAR=$(ls $SERVICE/target/*.jar | grep -v original | head -n 1)
          echo "🚀 Deploying $SERVICE to $EC2_HOST"

          scp -i key.pem -o StrictHostKeyChecking=no "$JAR" $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
          set -e
          sudo mkdir -p /opt/$SERVICE
          sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE

          echo "KAFKA_BOOTSTRAP_SERVERS_TLS=$KAFKA_BROKERS_TLS" | sudo tee /opt/$SERVICE/.env

          if [ ! -f /etc/systemd/system/$SERVICE.service ]; then
            sudo tee /etc/systemd/system/$SERVICE.service > /dev/null << EOL
          [Unit]
          Description=$SERVICE
          After=network.target

          [Service]
          User=$EC2_USER
          WorkingDirectory=/opt/$SERVICE
          ExecStart=/usr/bin/java -Xms512m -Xmx1g -jar /opt/$SERVICE/$SERVICE.jar
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOL
                      sudo systemctl daemon-reload
                      sudo systemctl enable $SERVICE
                    fi

                    sudo systemctl stop $SERVICE || true
                    mv /home/$EC2_USER/*.jar /opt/$SERVICE/$SERVICE.jar
                    sudo systemctl start $SERVICE
                    sudo systemctl status $SERVICE --no-pager
                    EOF

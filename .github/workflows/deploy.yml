name: Deploy Multiple Microservices to EC2

# Trigger on push to master/main OR manual run
on:
  push:
    branches:
      - master
      - main
    paths:
      - "sbt-kafka-order-payment-stock-service/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
#          - payment-service
#          - stock-service

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3️⃣ Debug folder structure
      - name: Debug workspace
        run: |
          echo "Current directory:"
          pwd
          echo "Repo root contents:"
          ls -lrt
          echo "sbt-kafka-order-payment-stock-service contents:"
          ls -lrt sbt-kafka-order-payment-stock-service || echo "Folder not found"

      # 4️⃣ Build all Maven modules from parent POM
      - name: Build Maven project
        run: |
          # Adjust this folder name to whatever is actually in repo
          cd sbt-kafka-order-payment-stock-service || exit 1
          mvn clean install -DskipTests

      # ✅ Add EC2 host to known_hosts BEFORE connecting
      - name: Add EC2 to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 5️⃣ Optional: deploy service
      - name: Deploy order-service to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}  # private key stored as GitHub Secret
        run: |
          echo "Deploying order-service..."

          # Write private key to temporary file
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          # Copy JAR to EC2
          scp -i key.pem sbt-kafka-order-payment-stock-service/order-service/target/order-service-1.0-SNAPSHOT.jar $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          # SSH into EC2 and restart service
          ssh -i key.pem $EC2_USER@$EC2_HOST << 'EOF'
          # Stop previous service
          sudo systemctl stop order-service || true

          # Replace the JAR
          mv ~/order-service-1.0-SNAPSHOT.jar /opt/order-service/order-service.jar

          # Start service
          sudo systemctl start order-service

          # Optional: check status
          sudo systemctl status order-service
          EOF

      - name: Verify Java version
        run: java -version


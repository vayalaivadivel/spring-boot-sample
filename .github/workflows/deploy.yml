name: Deploy Multiple Microservices to EC2

on:
  push:
    branches:
      - master
      - main
    paths:
      - "sbt-kafka-order-payment-stock-service/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
          # - payment-service
          # - stock-service

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3️⃣ Build Maven project
      - name: Build Maven project
        run: |
          cd sbt-kafka-order-payment-stock-service
          mvn clean install -DskipTests

      # 4️⃣ Deploy each service
      - name: Deploy ${{ matrix.service }} to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY:  ${{ secrets.EC2_KEY }}
        run: |
          echo "🚀 Deploying ${{ matrix.service }}..."

          # Create SSH key
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          # Copy JAR to EC2
          scp -i key.pem \
            -o StrictHostKeyChecking=no \
            sbt-kafka-order-payment-stock-service/${{ matrix.service }}/target/${{ matrix.service }}-1.0-SNAPSHOT.jar \
            $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          # Stop service
          ssh -i key.pem -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST \
            "sudo systemctl stop ${{ matrix.service }} || true"

          # Move JAR
          ssh -i key.pem -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST \
            "sudo mv /home/$EC2_USER/${{ matrix.service }}-1.0-SNAPSHOT.jar /opt/${{ matrix.service }}/${{ matrix.service }}.jar"

          # Start service
          ssh -i key.pem -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST \
            "sudo systemctl start ${{ matrix.service }}"

          # Check status
          ssh -i key.pem -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST \
            "sudo systemctl status ${{ matrix.service }} --no-pager"

      # 5️⃣ Verify Java
      - name: Verify Java version
        run: java -version
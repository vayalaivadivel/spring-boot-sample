name: CI-CD-Terraform-EC2-MSK

on:
  push:
    branches:
      - master

env:
  AWS_REGION: us-east-1

# ==========================================================
# 1️⃣ Terraform Provision (EC2 + MSK)
# ==========================================================
jobs:

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_brokers_tls: ${{ steps.tf_outputs.outputs.kafka_brokers_tls }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (IAM User)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_brokers_tls=$(terraform output -raw kafka_bootstrap_brokers_tls)" >> $GITHUB_OUTPUT


# ==========================================================
# 2️⃣ Build Spring Boot Services
# ==========================================================
  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: terraform

    strategy:
      matrix:
        service:
          - order-service
          - payment-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}
          path: ${{ matrix.service }}/target/*.jar


# ==========================================================
# 3️⃣ Deploy to EC2
# ==========================================================
  deploy:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: [terraform, build]

    strategy:
      matrix:
        service:
          - order-service
          - payment-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}
          path: .

      - name: Deploy ${{ matrix.service }} to EC2
        env:
          EC2_HOST: ${{ needs.terraform.outputs.ec2_ip }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY:  ${{ secrets.EC2_KEY }}
          SERVICE:  ${{ matrix.service }}
          KAFKA_BROKERS: ${{ needs.terraform.outputs.kafka_brokers_tls }}

        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          JAR=$(ls *.jar | head -n 1)
          echo "🚀 Deploying $SERVICE to $EC2_HOST"

          # Copy JAR
          scp -i key.pem -o StrictHostKeyChecking=no "$JAR" $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          # SSH Configuration
          ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
          set -e

          sudo mkdir -p /opt/$SERVICE
          sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE

          # Write Kafka TLS broker to .env
          echo "KAFKA_BOOTSTRAP_SERVERS=$KAFKA_BROKERS" | sudo tee /opt/$SERVICE/.env

          # Create systemd service
          sudo tee /etc/systemd/system/$SERVICE.service > /dev/null << EOL
          [Unit]
          Description=$SERVICE
          After=network.target

          [Service]
          User=$EC2_USER
          WorkingDirectory=/opt/$SERVICE
          EnvironmentFile=/opt/$SERVICE/.env
          ExecStart=/usr/bin/java -Xms512m -Xmx1g -jar /opt/$SERVICE/$SERVICE.jar
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOL

                    sudo systemctl daemon-reload
                    sudo systemctl enable $SERVICE

                    # Move new JAR
                    mv /home/$EC2_USER/*.jar /opt/$SERVICE/$SERVICE.jar

                    sudo systemctl restart $SERVICE
                    sudo systemctl status $SERVICE --no-pager
          EOF
name: Deploy Microservices to EC2 (Matrix Deploy)

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  PROJECT_DIR: sbt-kafka-order-payment-stock-service
  AWS_REGION: us-east-1

jobs:

  # =====================================================
  # 1️⃣ Build All Services
  # =====================================================
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    strategy:
      matrix:
        service:
          - order-service
          # Add other services here

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        run: |
          echo "🔹 Building ${{ matrix.service }}..."
          mvn clean package -pl ${{ matrix.service }} -am -DskipTests

          echo "🔹 Checking target directory..."
          ls -la ${{ matrix.service }}/target

          JAR=$(find ${{ matrix.service }}/target -name "*.jar" ! -name "original*" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "❌ JAR not found for ${{ matrix.service }}"
            exit 1
          fi

          echo "✅ Built ${{ matrix.service }}: $JAR"

      - name: Upload ${{ matrix.service }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar
          if-no-files-found: error

  # =====================================================
  # 2️⃣ Terraform Infrastructure
  # =====================================================
  terraform:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/terraform
    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_brokers_tls: ${{ steps.tf_outputs.outputs.kafka_brokers_tls }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform validate
          terraform plan -var-file=${{ env.ENVIRONMENT }}/terraform.tfvars -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_brokers_tls=$(terraform output -raw kafka_bootstrap_brokers_tls)" >> $GITHUB_OUTPUT

  # =====================================================
  # 3️⃣ Deploy Microservices (Matrix)
  # =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build, terraform]
    strategy:
      matrix:
        service:
          - order-service
          # Add other services here

    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ${{ matrix.service }} JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./artifact
          if-no-files-found: error

      - name: Deploy ${{ matrix.service }}
        env:
          EC2_HOST: ${{ needs.terraform.outputs.ec2_ip }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          SERVICE: ${{ matrix.service }}
          KAFKA_BROKERS_TLS: ${{ needs.terraform.outputs.kafka_brokers_tls }}
        run: |
          set -e
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          echo "🔍 Searching JAR for $SERVICE..."
          JAR=$(find ./artifact -name "${SERVICE}*.jar" ! -name "original*" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "❌ JAR not found for $SERVICE"
            exit 1
          fi
          echo "✅ Found JAR: $JAR"
          echo "🚀 Deploying $SERVICE to $EC2_HOST"

          ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
            set -e
            sudo mkdir -p /opt/$SERVICE
            sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE
            echo "KAFKA_BOOTSTRAP_SERVERS_TLS=$KAFKA_BROKERS_TLS" | sudo tee /opt/$SERVICE/.env

            if [ ! -f /etc/systemd/system/$SERVICE.service ]; then
              sudo tee /etc/systemd/system/$SERVICE.service > /dev/null << EOL
            [Unit]
            Description=$SERVICE
            After=network.target

            [Service]
            User=$EC2_USER
            WorkingDirectory=/opt/$SERVICE
            EnvironmentFile=/opt/$SERVICE/.env
            ExecStart=/usr/bin/java -Xms512m -Xmx1g -jar /opt/$SERVICE/$SERVICE.jar
            Restart=always
            SuccessExitStatus=143

            [Install]
            WantedBy=multi-user.target
            EOL
              sudo systemctl daemon-reload
              sudo systemctl enable $SERVICE
            fi

            sudo systemctl stop $SERVICE || true
            sudo cp ./artifact/$SERVICE*.jar /opt/$SERVICE/$SERVICE.jar
            sudo systemctl start $SERVICE
            sudo systemctl status $SERVICE --no-pager

            echo ""
            echo "========================"
            echo "Service: $SERVICE"
            echo "EC2 IP: $EC2_HOST"
            echo "Kafka Brokers TLS: $KAFKA_BROKERS_TLS"
            echo "========================"
          EOF
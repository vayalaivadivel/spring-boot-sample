name: Deploy-Microservices-with-Terraform

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  PROJECT_DIR: kafka-ord-pay-stk-service
  AWS_REGION: us-east-1

# =====================================================
# 1️⃣ Detect Changed Modules
# =====================================================
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: set-matrix
        run: |
          echo "🔍 Detecting changed modules..."

          if [ "${{ github.event.before }}" = "" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          SERVICES=()
          CORE_CHANGED=false

          if echo "$CHANGED" | grep -q "kafka-ord-pay-stk-service/core-common/"; then
            CORE_CHANGED=true
          fi

          for svc in order-service payment-service stock-service; do
            if echo "$CHANGED" | grep -q "kafka-ord-pay-stk-service/$svc/"; then
              SERVICES+=("$svc")
            fi
          done

          if [ "$CORE_CHANGED" = true ]; then
            SERVICES=("order-service" "payment-service" "stock-service")
          fi

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "Final JSON: []"
          else
            JSON=$(printf '"%s",' "${SERVICES[@]}")
            JSON="[${JSON%,}]"
            echo "services=$JSON" >> $GITHUB_OUTPUT
            echo "Final JSON: $JSON"
          fi

# =====================================================
# 2️⃣ Build Changed Services (parallel)
# =====================================================
  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "🔨 Building ${{ matrix.service }}..."
          mvn -pl ${{ matrix.service }} -am clean package -DskipTests

          JAR=$(find ${{ matrix.service }}/target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "❌ JAR not found"
            exit 1
          fi

          mkdir -p artifact
          cp "$JAR" artifact/${{ matrix.service }}.jar

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ env.PROJECT_DIR }}/artifact/${{ matrix.service }}.jar

# =====================================================
# 3️⃣ Terraform Infrastructure (parallel with build)
# =====================================================
  terraform:
    runs-on: ubuntu-latest
    needs: detect-changes
    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_brokers_tls: ${{ steps.tf_outputs.outputs.kafka_brokers_tls }}
      rds_endpoint: ${{ steps.tf_outputs.outputs.rds_endpoint }}
      rds_username: ${{ steps.tf_outputs.outputs.rds_username }}
      rds_password: ${{ steps.tf_outputs.outputs.rds_password }}

    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform validate
          terraform plan -var-file=${{ env.ENVIRONMENT }}/terraform.tfvars -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_brokers_tls=$(terraform output -raw kafka_bootstrap_brokers_tls)" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "rds_username=$(terraform output -raw rds_username)" >> $GITHUB_OUTPUT
          echo "rds_password=$(terraform output -raw rds_password)" >> $GITHUB_OUTPUT

# =====================================================
# 4️⃣ Deploy
# =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build, terraform]   # ✅ FIXED
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: artifact/${{ matrix.service }}

      - name: Deploy ${{ matrix.service }}
        run: |
          echo "🚀 Deploying ${{ matrix.service }} to ${{ needs.terraform.outputs.ec2_ip }}"
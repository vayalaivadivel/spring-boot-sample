name: Deploy microservices to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service

    steps:
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      - name: Setup Java 21 for Maven build
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Java version
        run: java -version

      # -----------------------------
      - name: Build ${{ matrix.service }}
        run: |
          echo "📦 Building ${{ matrix.service }} + dependencies"

          cd sbt-kafka-order-payment-stock-service

          mvn clean package \
            -pl ${{ matrix.service }} \
            -am \
            -DskipTests

          JAR=$(ls ${{ matrix.service }}/target/*.jar | grep -v original | head -n 1)
          if [ ! -f "$JAR" ]; then
            echo "❌ Error: JAR not found for ${{ matrix.service }}"
            exit 1
          fi

          echo "✅ Built JAR: $JAR"

      # -----------------------------
      - name: Deploy ${{ matrix.service }} to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY:  ${{ secrets.EC2_KEY }}
          SERVICE:  ${{ matrix.service }}
        run: |
          echo "🚀 Deploying $SERVICE..."

          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          JAR=$(ls sbt-kafka-order-payment-stock-service/$SERVICE/target/*.jar | grep -v original | head -n 1)
          echo "Using JAR: $JAR"

          scp -i key.pem -o StrictHostKeyChecking=no \
            "$JAR" $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          ssh -i key.pem -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST << EOF
          set -e

          sudo mkdir -p /opt/$SERVICE
          sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE

          if [ ! -f /etc/systemd/system/$SERVICE.service ]; then
          sudo tee /etc/systemd/system/$SERVICE.service > /dev/null << EOL
          [Unit]
          Description=$SERVICE
          After=network.target

          [Service]
          User=$EC2_USER
          WorkingDirectory=/opt/$SERVICE
          ExecStart=/usr/bin/java -jar /opt/$SERVICE/$SERVICE.jar
          Restart=always
          RestartSec=5
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOL
          sudo systemctl daemon-reload
          sudo systemctl enable $SERVICE
          fi

          sudo systemctl stop $SERVICE || true

          mv /home/$EC2_USER/*.jar /opt/$SERVICE/$SERVICE.jar

          sudo systemctl start $SERVICE

          sudo journalctl -u $SERVICE -n 50 --no-pager
          EOF
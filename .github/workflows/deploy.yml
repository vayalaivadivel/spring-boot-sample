name: Deploy Multiple Microservices to EC2

# Trigger on push to master/main OR manual run
on:
  push:
    branches:
      - master
      - main
    paths:
      - "sbt-kafka-order-payment-stock-service/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
#          - payment-service
#          - stock-service

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3️⃣ Debug folder structure
      - name: Debug workspace
        run: |
          echo "Current directory:"
          pwd
          echo "Repo root contents:"
          ls -lrt
          echo "sbt-kafka-order-payment-stock-service contents:"
          ls -lrt sbt-kafka-order-payment-stock-service || echo "Folder not found"

      # 4️⃣ Build all Maven modules from parent POM
      - name: Build Maven project
        run: |
          # Adjust this folder name to whatever is actually in repo
          cd sbt-kafka-order-payment-stock-service || exit 1
          mvn clean install -DskipTests

      # 5️⃣ Optional: deploy service
      - name: Deploy service
        run: |
          echo "Deploying ${{ matrix.service }}..."
          # Insert your EC2 deployment commands here

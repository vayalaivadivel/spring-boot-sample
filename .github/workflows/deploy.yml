name: Deploy Multiple Microservices to EC2

on:
  push:
    branches:
      - master
      - main
    paths:
      - "sbt-kafka-order-payment-stock-service/order-service/**"
      # - "sbt-kafka-order-payment-stock-service/payment-service/**"
      # - "sbt-kafka-order-payment-stock-service/stock-service/**"
      - "sbt-kafka-order-payment-stock-service/core-common/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
#          - payment-service
#          - stock-service

    defaults:
      run:
        working-directory: sbt-kafka-order-payment-stock-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven


      # - name: Build service
      #   run: |
      #     cd ${{ matrix.service }}
      #     mvn clean package -DskipTests
      - name: Build all modules
        run: |
          cd sbt-kafka-order-payment-stock-service
          mvn clean install -DskipTests


      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "sbt-kafka-order-payment-stock-service/${{ matrix.service }}/target/*.jar"
          target: "/opt/microservices/${{ matrix.service }}"

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mv /opt/microservices/${{ matrix.service }}/target/*.jar \
                    /opt/microservices/${{ matrix.service }}/app.jar
            sudo systemctl restart ${{ matrix.service }}
name: Deploy microservices to EC2 with terraform

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:

  # =====================================================
  # 1️⃣ Build Microservices
  # =====================================================
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
          # - payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        run: |
          cd sbt-kafka-order-payment-stock-service

          mvn clean package \
            -pl ${{ matrix.service }} \
            -am \
            -DskipTests

          JAR=$(ls ${{ matrix.service }}/target/*.jar | grep -v original | head -n 1)
          if [ ! -f "$JAR" ]; then
            echo "❌ JAR not found"
            exit 1
          fi

          echo "✅ Built $JAR"

  # =====================================================
  # 2️⃣ Terraform Infrastructure Provisioning
  # =====================================================
  terraform:
    runs-on: ubuntu-latest
    needs: build

    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_brokers: ${{ steps.tf_outputs.outputs.kafka_brokers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var-file=${{ env.ENVIRONMENT }}/terraform.tfvars \
            -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          cd terraform
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_brokers=$(terraform output -raw kafka_bootstrap_brokers)" >> $GITHUB_OUTPUT


  # =====================================================
  # 3️⃣ Deploy Microservices to EC2
  # =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: terraform

    strategy:
      matrix:
        service:
          - order-service
          - payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy ${{ matrix.service }}
        env:
          EC2_HOST: ${{ needs.terraform.outputs.ec2_ip }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY:  ${{ secrets.EC2_KEY }}
          SERVICE:  ${{ matrix.service }}
          KAFKA_BROKERS: ${{ needs.terraform.outputs.kafka_brokers }}
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          JAR=$(ls sbt-kafka-order-payment-stock-service/$SERVICE/target/*.jar | grep -v original | head -n 1)

          echo "🚀 Deploying $SERVICE to $EC2_HOST"

          scp -i key.pem -o StrictHostKeyChecking=no \
            "$JAR" $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          ssh -i key.pem -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST << EOF
          set -e

          sudo mkdir -p /opt/$SERVICE
          sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE

          # Create environment file
          echo "KAFKA_BOOTSTRAP_SERVERS=$KAFKA_BROKERS" | sudo tee /opt/$SERVICE/.env

          # Create systemd service if not exists
          if [ ! -f /etc/systemd/system/$SERVICE.service ]; then
          sudo tee /etc/systemd/system/$SERVICE.service > /dev/null << EOL
          [Unit]
          Description=$SERVICE
          After=network.target

          [Service]
          User=$EC2_USER
          WorkingDirectory=/opt/$SERVICE
          ExecStart=/usr/bin/java -Xms512m -Xmx1g -jar /opt/$SERVICE/$SERVICE.jar
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOL
          sudo systemctl daemon-reload
          sudo systemctl enable $SERVICE
          fi

          sudo systemctl stop $SERVICE || true
          mv /home/$EC2_USER/*.jar /opt/$SERVICE/$SERVICE.jar
          sudo systemctl start $SERVICE
          sudo systemctl status $SERVICE --no-pager
          EOF

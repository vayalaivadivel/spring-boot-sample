name: Deploy-Microservices with terraform.

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  PROJECT_DIR: kafka-ord-pay-stk-service
  AWS_REGION: us-east-1

jobs:

  # =====================================================
  # 1️⃣ Build All Services and Upload Artifacts
  # =====================================================
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - order-service
          - payment-service
          - stock-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "🔨 Building ${{ matrix.service }}..."
          mvn -pl ${{ matrix.service }} -am clean package -DskipTests

          # Find Spring Boot fat JAR
          JAR=$(find ${{ matrix.service }}/target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "❌ JAR not found for ${{ matrix.service }}"
            find . -name "*.jar"
            exit 1
          fi

          mkdir -p artifact
          cp "$JAR" artifact/${{ matrix.service }}.jar
          echo "✅ Built and copied: ${{ matrix.service }}.jar"

      - name: Upload Artifact for ${{ matrix.service }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ env.PROJECT_DIR }}/artifact/${{ matrix.service }}.jar
      
      - name: Show uploaded artifact path
        run: |
          echo "📦 Uploaded artifact name: ${{ matrix.service }}-jar"
          echo "🛠 Local artifact path: ${{ env.PROJECT_DIR }}/artifact/${{ matrix.service }}.jar"


  # =====================================================
  # 2️⃣ Terraform Infrastructure
  # =====================================================
  terraform:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_brokers_tls: ${{ steps.tf_outputs.outputs.kafka_brokers_tls }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform validate
          terraform plan -var-file=${{ env.ENVIRONMENT }}/terraform.tfvars -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_brokers_tls=$(terraform output -raw kafka_bootstrap_brokers_tls)" >> $GITHUB_OUTPUT

# =====================================================
# 3️⃣ Deploy Microservices (Matrix)
# =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build, terraform]
    strategy:
      matrix:
        service:
          - order-service
          # - payment-service
          # - stock-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact for ${{ matrix.service }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: artifact/${{ matrix.service }}

      - name: List downloaded files
        run: |
          echo "📦 Contents of ${{ matrix.service }} artifact:"
          ls -l artifact/${{ matrix.service}}
          echo "🔹 Recursive listing:"
          find artifact/${{ matrix.service}} -type f

      - name: Deploy ${{ matrix.service }} to EC2
        env:
          EC2_HOST: ${{ needs.terraform.outputs.ec2_ip }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          SERVICE: ${{ matrix.service }}
          KAFKA_BROKERS_TLS: ${{ needs.terraform.outputs.kafka_brokers_tls }}
        run: |
          set -e

          # Save SSH key
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          JAR=$(find artifact/$SERVICE -maxdepth 1 -name "*.jar" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "❌ JAR not found for $SERVICE"
            exit 1
          fi
          echo "✅ Found JAR: $JAR"
          echo "🚀 Deploying $SERVICE to $EC2_HOST"

          # Prepare EC2 directory with sudo
          ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST \
            "sudo mkdir -p /opt/$SERVICE && sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE"

          # Copy JAR
          scp -i key.pem -o StrictHostKeyChecking=no "$JAR" $EC2_USER@$EC2_HOST:/opt/$SERVICE/$SERVICE.jar

          # Configure systemd & environment
          ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
            set -e
            sudo chown -R $EC2_USER:$EC2_USER /opt/$SERVICE
            # Correct environment variable name to match application.yml
            echo "KAFKA_BOOTSTRAP_SERVERS=$KAFKA_BROKERS_TLS" | sudo tee /opt/$SERVICE/.env > /dev/null

            if [ ! -f /etc/systemd/system/$SERVICE.service ]; then
              sudo tee /etc/systemd/system/$SERVICE.service > /dev/null << EOL
          [Unit]
          Description=$SERVICE
          After=network.target

          [Service]
          User=$EC2_USER
          WorkingDirectory=/opt/$SERVICE
          EnvironmentFile=/opt/$SERVICE/.env
          ExecStart=/usr/bin/java -Xms512m -Xmx1g -jar /opt/$SERVICE/$SERVICE.jar
          Restart=always
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOL
                      sudo systemctl daemon-reload
                      sudo systemctl enable $SERVICE
                    fi

                    sudo systemctl stop $SERVICE || true
                    sudo systemctl start $SERVICE
                    sudo systemctl status $SERVICE --no-pager

                    echo ""
                    echo "========================"
                    echo "Service: $SERVICE"
                    echo "EC2 IP: $EC2_HOST"
                    echo "Kafka Brokers TLS: $KAFKA_BROKERS_TLS"
                    echo "========================"
          EOF

                  # Remove SSH key for security
                  rm -f key.pem
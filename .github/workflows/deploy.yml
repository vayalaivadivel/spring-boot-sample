name: Deploy Microservices to EC2 (Matrix)

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  PROJECT_DIR: sbt-kafka-order-payment-stock-service
  AWS_REGION: us-east-1

jobs:

  # =====================================================
  # 1️⃣ Build All Services and Upload Artifacts
  # =====================================================
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build all services
        run: |
          mkdir -p artifact
          SERVICES=("order-service") # Add more modules here

          for SERVICE in "${SERVICES[@]}"; do
            echo "🔨 Building $SERVICE..."
            mvn clean package -pl $SERVICE -am -DskipTests

            # Find the Spring Boot fat JAR
            JAR=$(find $SERVICE/target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
            if [ -z "$JAR" ]; then
              echo "❌ JAR not found for $SERVICE"
              exit 1
            fi

            echo "✅ Built $SERVICE: $JAR"
            cp "$JAR" artifact/
          done

      - name: List artifacts
        run: ls -la artifact

      - name: Upload all JARs
        uses: actions/upload-artifact@v4
        with:
          name: microservices-jars
          path: artifact/*.jar
          if-no-files-found: error

  # =====================================================
  # 2️⃣ Terraform Infrastructure
  # =====================================================
  terraform:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      ec2_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      kafka_brokers_tls: ${{ steps.tf_outputs.outputs.kafka_brokers_tls }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform validate
          terraform plan -var-file=${{ env.ENVIRONMENT }}/terraform.tfvars -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "kafka_brokers_tls=$(terraform output -raw kafka_bootstrap_brokers_tls)" >> $GITHUB_OUTPUT
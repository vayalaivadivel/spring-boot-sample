name: Deploy Multiple Microservices to EC2

# Trigger on push to master/main OR manual run
on:
  push:
    branches:
      - master
      - main
    paths:
      - "sbt-kafka-order-payment-stock-service/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
#          - payment-service
#          - stock-service

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3️⃣ Debug folder structure
      - name: Debug workspace
        run: |
          echo "Current directory:"
          pwd
          echo "Repo root contents:"
          ls -lrt
          echo "sbt-kafka-order-payment-stock-service contents:"
          ls -lrt sbt-kafka-order-payment-stock-service || echo "Folder not found"

      # 4️⃣ Build all Maven modules from parent POM
      - name: Build Maven project
        run: |
          cd sbt-kafka-order-payment-stock-service || exit 1
          mvn clean install -DskipTests

      # 5️⃣ Add EC2 host to known_hosts
      - name: Add EC2 to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 6️⃣ Deploy order-service to EC2
      - name: Deploy order-service to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          echo "Deploying ${{ matrix.service }}..."

          # Write private key to temporary file
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem

          # Copy JAR to EC2 **disabling host key checking**
          scp -i key.pem -o StrictHostKeyChecking=no sbt-kafka-order-payment-stock-service/${{ matrix.service }}/target/${{ matrix.service }}-1.0-SNAPSHOT.jar $EC2_USER@$EC2_HOST:/home/$EC2_USER/

          # SSH into EC2 and restart service **disabling host key checking**
          ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            sudo systemctl stop order-service || true
            mv ~/order-service-1.0-SNAPSHOT.jar /opt/order-service/order-service.jar
            sudo systemctl start order-service
            sudo systemctl status order-service
          EOF

      # 7️⃣ Verify Java version
      - name: Verify Java version
        run: java -version
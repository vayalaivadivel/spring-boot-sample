spring:
  application.name: payment-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update   # create | create-drop | validate | update | none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  properties:
    security:
      protocol: SSL
      ssl.endpoint.identification.algorithm: ""   # disables hostname verification
  admin:
    client-id: adminclient-1
  producer:
    key-serializer: org.apache.kafka.common.serialization.LongSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  streams:
    properties:
      default.key.serde: org.apache.kafka.common.serialization.Serdes$LongSerde
      default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
      spring.json.trusted.packages: "*"
    state-dir: /tmp/kafka-streams/

management:
  health:
    binders:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ALWAYS
# Set a custom health URL
management.endpoints.web.base-path: /payment-service
logging.pattern.console: "%clr(%d{HH:mm:ss.SSS}){blue} %clr(---){faint} %clr([%15.15t]){yellow} %clr(:){red} %clr(%m){faint}%n"
server:
  port: 8082
